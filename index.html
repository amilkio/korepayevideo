<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kore Officiel CASH PRO</title><style>body{font-family:Arial;background:linear-gradient(135deg,#000,#D4AF37);margin:0;padding:20px;text-align:center;min-height:100vh}.container{max-width:500px;margin:30px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}.logo{width:120px;margin-bottom:10px}h1{color:#000;margin:5px}h2{color:#D4AF37;margin:5px}.gain{background:#D4AF37;color:white;padding:12px;border-radius:8px;font-weight:bold;margin:15px 0}input,select{width:90%;padding:12px;margin:8px 0;border:2px solid #D4AF37;border-radius:8px;font-size:16px}button{background:#000;color:#D4AF37;padding:14px 20px;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;width:95%;margin-top:10px}</style></head><body><div class="container"><img src="logo.jpg" class="logo"><h1>Kore Officiel</h1><h2>CASH PRO</h2><div class="gain">GAGNEZ 5200 FCFA + 4000 FCFA PAR FILLEUL</div><form id="inscriptionForm"><input type="text" id="nom" placeholder="Nom" required><input type="text" id="prenom" placeholder="Prénom" required><input type="email" id="email" placeholder="Email" required><input type="tel" id="telephone" placeholder="Numéro WhatsApp" required><select id="operateur" required><option value="">-- Opérateur MoMo --</option><option>Moov Money</option><option>MTN MoMo</option><option>Orange Money</option><option>Wave</option><option>Vodacom</option><option>Airtel Money</option><option>TMoney</option></select><input type="tel" id="numero_momo" placeholder="Numéro Mobile Money" required><input type="text" id="parrain" placeholder="Code Parrain"><input type="password" id="password" placeholder="Mot de passe" required><button type="submit">S'INSCRIRE MAINTENANT</button></form></div><script>const tonNumeroWhatsApp="22969649083";const urlParams=new URLSearchParams(window.location.search);if(urlParams.get('parrain')){document.getElementById('parrain').value=urlParams.get('parrain')}document.getElementById('inscriptionForm').addEventListener('submit',function(e){e.preventDefault();const data={date:new Date().toLocaleString(),nom:document.getElementById('nom').value,prenom:document.getElementById('prenom').value,email:document.getElementById('email').value,telephone:document.getElementById('telephone').value,operateur:document.getElementById('operateur').value,numero_momo:document.getElementById('numero_momo').value,parrain:document.getElementById('parrain').value||"Aucun"};window.open(`https://wa.me/${tonNumeroWhatsApp}?text=Nouvelle Inscription Kore: ${data.nom} ${data.prenom} - ${data.telephone}`,'_blank');localStorage.setItem('kore_user',JSON.stringify(data));localStorage.setItem('videos',JSON.stringify([]));setTimeout(()=>{window.location.href="tableau-de-bord.html"},1500)})</script></body></html>
